# ---------------------------------------------------------------------------
# ECON 7102 -- Environmental Economics I
# Single source of truth for the course schedule and reading list.
#
# Everything downstream is generated from this file: the website schedule and
# readings pages, and the LaTeX schedule table and reading list that are
# \input into the syllabus. Edit here, then run build/build.R.
#
# Reading fields
#   authors     Author string as it should appear in the citation.
#   year        Publication year.
#   title       Article or chapter title, plain text, no quotation marks.
#   outlet      Journal, book, or working paper series.
#   note        Optional trailing detail (e.g. chapter or section guidance).
#   url         Public link (DOI, publisher, or working paper page). Optional.
#   source_pdf  Path relative to the course readings directory. Optional.
#   pdf         Filename served by the website. Generated by stage_readings.sh.
#   response    true if a written reading response is due for this item.
#   discussion  true if this item is eligible for a student-led discussion.
#
# CALENDAR NOTE: Fall 2026 dates below follow classes beginning Mon 24 Aug,
# Labor Day Mon 7 Sep, fall recess Mon 5 Oct, Thanksgiving Wed 25 Nov, and
# final instructional day Mon 7 Dec. Confirm against the official Georgia Tech
# registrar calendar before distributing the syllabus.
# ---------------------------------------------------------------------------

course:
  code: ECON 7102
  title: Environmental Economics I
  term: Fall 2026
  instructor: Casey J. Wichman
  email: wichman@gatech.edu
  institution: Georgia Institute of Technology
  office: Old Civil Engineering 310
  office_hours: By appointment
  meeting_days: Mon/Wed
  meeting_time: 11:00 AM -- 12:15 PM
  classroom: TBD
  textbook:
    authors: Daniel J. Phaneuf and Till Requate
    year: 2017
    title: "A Course in Environmental Economics: Theory, Policy, and Practice"
    outlet: Cambridge University Press
    short: "P&R"

grading:
  - item: '"Weekly" reading responses'
    points: 20
  - item: Research paper proposal
    points: 35
  - item: Midterm
    points: 25
  - item: Lead in-class discussion
    points: 10
  - item: Referee report on JMP
    points: 10

milestones:
  - item: Project idea and research sketch
    points: 5
    due: 2026-10-09
  - item: Expanded outline and literature review
    points: 5
    due: 2026-11-06
  - item: Presentation
    points: 5
    due: null
    note: Last four classes of the semester
  - item: Final proposal
    points: 20
    due: 2026-12-11

